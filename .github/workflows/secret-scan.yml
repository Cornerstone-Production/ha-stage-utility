# Fails a PR that introduces a credential, and re-checks the whole history weekly.
#
# Runs the gitleaks binary directly rather than gitleaks-action, which gates
# organisation use behind a licence key. Same scanner, one less dependency, and
# nothing to renew.
#
# Two scopes, deliberately. A PR is scanned over only its own commits — fast, and
# it fails the person who can still fix it. The scheduled run covers every ref,
# because a rule added to gitleaks after a commit landed would otherwise never be
# applied to it.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main, beta]
  schedule:
    - cron: "17 6 * * 1" # Mondays, off the hour to avoid the rush
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history — a shallow clone scans nothing useful

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Keep the published filename: sha256sum -c resolves the name written in
          # the checksums file, so renaming the download makes verification fail.
          curl -fsSL -o "$tarball"      "${base}/${tarball}"
          curl -fsSL -o checksums.txt   "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Integrity of the download, against a truncated or corrupted fetch.
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only what this PR adds. The base ref is fetched by fetch-depth: 0.
            RANGE="origin/${{ github.base_ref }}..HEAD"
            # A range that does not resolve would scan nothing and pass, which is
            # the one failure mode a scanner must not have. Fail loudly instead.
            git rev-parse --verify --quiet "origin/${{ github.base_ref }}" >/dev/null \
              || { echo "::error::base ref origin/${{ github.base_ref }} not found — refusing to report a vacuous pass"; exit 1; }
            echo "scanning $RANGE ($(git rev-list --count "$RANGE") commits)"
            gitleaks git . --log-opts="$RANGE" --redact --verbose
          else
            # Every branch and tag. Merge commits are skipped by gitleaks because
            # they carry no content their parents do not already have.
            echo "scanning all refs"
            gitleaks git . --log-opts="--all" --redact --verbose
          fi

      - name: Scan the working tree
        # Catches anything committed in a form the history scan would miss, and
        # any file present but untracked.
        run: gitleaks dir . --redact --verbose
